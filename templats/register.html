{% extends "base.html" %}

{% block content %}

<div class="form-box">

<h2>Create Student Account 👨‍🎓</h2>

<form method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required
class="form-control mb-3">


<input
type="email"
name="email"
placeholder="Email"
required
class="form-control mb-3">


<input
type="password"
name="password"
placeholder="Password"
required
class="form-control mb-3">


<button class="btn btn-primary w-100">

Create Account

</button>

</form>

</div>

{% endblock %}
